name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm run build:plugin
      - name: Smoke test — server starts and responds
        run: |
          npx next start -p 3123 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3123/ > /dev/null && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3123/ || { cat server.log; exit 1; }
          curl -sf http://localhost:3123/api/fonts
          echo "OK"
